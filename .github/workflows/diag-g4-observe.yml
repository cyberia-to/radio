name: diag-g4-observe

on:
  push:
    branches: [diag/g4-observe-fs]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      - name: Build test binary once
        run: |
          mkdir -p diag
          rustc -V | tee diag/toolchain.txt
          cargo test --locked -p iroh-blobs --lib --no-run 2>&1 | tee diag/build.log

      - name: A node_serve_blobs isolated x20
        if: always()
        shell: bash
        env:
          RUST_LOG: iroh_blobs=debug,radio=info
        run: |
          set +e
          pass=0
          for i in $(seq 1 20); do
            cargo test --locked -p iroh-blobs --lib tests::node_serve_blobs -- --exact --nocapture > diag/A_$i.log 2>&1
            if [ $? -eq 0 ]; then pass=$((pass+1)); echo "A iter $i PASS"; else echo "A iter $i FAIL"; fi
          done
          echo "A node_serve_blobs isolated: $pass/20" | tee -a diag/summary.txt
          exit 0

      - name: B two_nodes_observe_fs isolated x20
        if: always()
        shell: bash
        env:
          RUST_LOG: iroh_blobs=debug,radio=info
        run: |
          set +e
          pass=0
          for i in $(seq 1 20); do
            cargo test --locked -p iroh-blobs --lib tests::two_nodes_observe_fs -- --exact --nocapture > diag/B_$i.log 2>&1
            if [ $? -eq 0 ]; then pass=$((pass+1)); echo "B iter $i PASS"; else echo "B iter $i FAIL"; fi
          done
          echo "B observe_fs isolated: $pass/20" | tee -a diag/summary.txt
          exit 0

      - name: C full lib parallel x10
        if: always()
        shell: bash
        run: |
          set +e
          k=0
          all=""
          for i in $(seq 1 10); do
            cargo test --locked -p iroh-blobs --lib > diag/C_$i.log 2>&1
            rc=$?
            f=$(awk '/^failures:$/{n++; next} n>=2 && /^    /{gsub(/^ +/,""); print} n>=2 && /^test result/{exit}' diag/C_$i.log | tr '\n' ' ')
            if [ $rc -ne 0 ]; then k=$((k+1)); fi
            echo "C iter $i rc=$rc failed: ${f:-none}"
            all="$all [iter $i rc=$rc: ${f:-none}]"
          done
          echo "C full lib parallel: $k/10 runs failed;$all" | tee -a diag/summary.txt
          exit 0

      - name: D full lib serial x3
        if: always()
        shell: bash
        run: |
          set +e
          k=0
          all=""
          for i in $(seq 1 3); do
            cargo test --locked -p iroh-blobs --lib -- --test-threads=1 > diag/D_$i.log 2>&1
            rc=$?
            f=$(awk '/^failures:$/{n++; next} n>=2 && /^    /{gsub(/^ +/,""); print} n>=2 && /^test result/{exit}' diag/D_$i.log | tr '\n' ' ')
            if [ $rc -ne 0 ]; then k=$((k+1)); fi
            echo "D iter $i rc=$rc failed: ${f:-none}"
            all="$all [iter $i rc=$rc: ${f:-none}]"
          done
          echo "D full lib serial: $k/3 runs failed;$all" | tee -a diag/summary.txt
          exit 0

      - name: Summary
        if: always()
        shell: bash
        run: |
          cat diag/summary.txt
          { echo '```'; cat diag/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag
          path: diag/
