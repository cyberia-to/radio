[package]
name = "radio-cli"
version = "0.1.0"
edition = "2021"
description = "Radio network CLI — transport over shared Cybergraph storage"
license = "MIT OR Apache-2.0"

[[bin]]
name = "radio"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
iroh = { package = "cyber-radio", path = "../iroh" }
cybergraph = { path = "../../cybergraph", features = ["local-storage", "legacy-redb-migration"] }
cybergraph-radio = { path = "../../cybergraph/radio", features = ["hdd"] }
iroh-gossip = { path = "../iroh-gossip" }
hemera = { package = "cyber-hemera", path = "../../hemera/rs" }
cyber-bao = { path = "../cyber-bao" }
anyhow = "1"
futures-lite = "2"
tracing-subscriber = "0.3"
data-encoding = "2"
bytes = "1"
rand = "0.9"

[dev-dependencies]
tempfile = "3"
